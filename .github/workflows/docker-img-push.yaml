name: Build and Push Docker Image
permissions:
  contents: read
  packages: write
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - Dockerfile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - name: Log in to GitHub Docker registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Assign environment variables used in subsequent steps
      - name: Env IMG_REPO_NAME Assignment
        env:
          DOCKERFILE_NAME: ${{ matrix.dockerfile }}
          IMG_REPO_NAME: ${{ github.repository }}
        run: echo "IMG_REPO_NAME=${IMG_REPO_NAME}" >> "${GITHUB_ENV}"
      # TAG_NAME defaults to 'latest' and uses the pushed tag name for tag builds
      - name: Assign TAG_NAME
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "TAG_NAME=latest" >> "${GITHUB_ENV}"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "" ]; then
            echo "TAG_NAME=$REF_NAME" >> "${GITHUB_ENV}"
          fi
      - name: Build Docker image only
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ env.TAG_NAME }}
      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ env.TAG_NAME }}
