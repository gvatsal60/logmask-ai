name: Build and Push Docker Image
permissions:
  contents: read
  packages: write
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - Dockerfile
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@e50058a0fcd8d1a7d626c905502d010a468bf238 # v4.4.1
      - name: Log in to GitHub Docker registry
        uses: step-security/docker-login-action@8c7b695d8738c5699a679ff5254baf0f19f20a94 # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Assign environment variables used in subsequent steps
      - name: Env IMG_REPO_NAME Assignment
        env:
          DOCKERFILE_NAME: ${{ matrix.dockerfile }}
          IMG_REPO_NAME: ${{ github.repository }}
        run: echo "IMG_REPO_NAME=${IMG_REPO_NAME}" >> "${GITHUB_ENV}"
      # TAG_NAME defaults to 'latest' and uses the pushed tag name for tag builds
      - name: Assign TAG_NAME
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "TAG_NAME=latest" >> "${GITHUB_ENV}"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "" ]; then
            echo "TAG_NAME=$REF_NAME" >> "${GITHUB_ENV}"
          fi
      - name: Build Docker image only
        if: github.event_name == 'pull_request'
        uses: step-security/docker-build-push-action@b736dc8a921e02a288f956d3dd9111e276a4cfec # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ env.TAG_NAME }}
      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: step-security/docker-build-push-action@b736dc8a921e02a288f956d3dd9111e276a4cfec # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ env.TAG_NAME }}
